name: WanderLust CI/CD Pipeline

on:
  push:
    branches: [main, optimize]
  pull_request:
    branches: [main, optimize]

jobs:
  lint-test-audit:
    name: Lint, Test & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: ESLint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          SECRET: ci-test-secret

      - name: Security Audit
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: lint-test-audit

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t wanderlust-app:test .

      - name: Verify Docker Image
        run: docker image inspect wanderlust-app:test

  deploy:
    name: Deploy to Render
    needs: [lint-test-audit, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          if [ "$response" != "200" ] && [ "$response" != "201" ] && [ "$response" != "202" ]; then
            echo "❌ Deploy failed with status: $response"
            exit 1
          fi
          echo "✅ Deploy triggered successfully (HTTP $response)"
